version: '3.8'

services:
  # ── Local Soroban sandbox ────────────────────────────────────────────
  # Runs a full Stellar local network with Soroban RPC enabled.
  # Used by the indexer in place of testnet/mainnet.
  soroban:
    image: stellar/quickstart:testing
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/.well-known/stellar.toml > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["--local", "--enable-soroban-rpc"]

  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: soroban_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d soroban_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Indexer ──────────────────────────────────────────────────────────
  indexer:
    build:
      context: ../../indexer
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/soroban_explorer
      SOROBAN_RPC_URL: http://soroban:8000/soroban/rpc
      HORIZON_URL: http://soroban:8000
      NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      START_LEDGER: 1
      POLL_MS: 2000
      PORT: 3001
      SAC_ASSETS: "[]"
      EXPLORER_CONTRACT_ID: ""
      LAG_ALERT_THRESHOLD_S: 120
      INDEXER_URL: http://indexer:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
    environment:
      VITE_API_PROXY: http://indexer:3001
      FRONTEND_URL: http://frontend:5173
    ports:
      - "5173:5173"
    depends_on:
      - indexer

volumes:
  postgres_data:
