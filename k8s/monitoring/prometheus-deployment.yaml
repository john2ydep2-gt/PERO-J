apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

    rule_files:
      - /etc/prometheus/alerts/*.yml

    scrape_configs:
      - job_name: "prometheus"
        scrape_interval: 15s
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "backend"
        scrape_interval: 15s
        metrics_path: "/metrics"
        static_configs:
          - targets: ["backend.default.svc.cluster.local:8080"]

      - job_name: "indexer"
        scrape_interval: 15s
        metrics_path: "/metrics"
        static_configs:
          - targets: ["indexer.default.svc.cluster.local:3001"]

      - job_name: "oracle-daemon"
        scrape_interval: 15s
        metrics_path: "/metrics"
        static_configs:
          - targets: ["oracle-daemon.default.svc.cluster.local:8081"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
