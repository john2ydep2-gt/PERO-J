global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alerts/*.yml"
  - "alerts/*.yml"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8080"]
    relabel_configs:
      - target_label: service
        replacement: backend

  - job_name: "indexer"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["indexer:3001"]
    relabel_configs:
      - target_label: service
        replacement: indexer

  - job_name: "oracle-daemon"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["oracle-daemon:8081"]
    relabel_configs:
      - target_label: service
        replacement: oracle-daemon
